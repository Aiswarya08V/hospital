apiVersion: apps/v1
kind: Deployment
metadata:
  name: hospital-portal
  labels:
    app: hospital-portal
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: hospital-portal
  template:
    metadata:
      labels:
        app: hospital-portal
    spec:
      containers:
      - name: hospital-portal
        image: aiswarya8/html-demo:latest # Replaced dynamically by Jenkins build numbers
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        livenessProbe:
          httpGet:
            path: /index.html
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /index.html
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: hospital-portal-service
spec:
  type: NodePort
  selector:
    app: hospital-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 32200
